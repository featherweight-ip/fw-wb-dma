
# yaml-language-server: $schema=https://fvutils.github.io/ivpm/ivpm.schema.json
package:
  name: fw-wb-dma

  dep-sets:
  - name: default-dev
    deps: 
    - name: wb_dma
      url: https://github.com/freecores/wb_dma.git
      anonymous: true
    - name: pssc
      url: https://git.dvkit.org/psstools/pssc.git
    - name: pssparser
      url: https://git.dvkit.org/psstools/pssparser.git
    - name: pss-skills
      url: https://git.dvkit.org/psstools/pss-skills.git
    - name: peakrdl-pss
      url: https://git.dvkit.org/psstools/peakrdl-pss.git
    - name: dv-flow-libproject
      url: https://git.dvkit.org/dv-flow/dv-flow-libproject.git
    - name: dv-flow-librdl
      url: https://git.dvkit.org/dv-flow/dv-flow-librdl.git
    - name: fw-hdl
      url: https://github.com/featherweight-hdl/fw-hdl.git
    - name: zuspec-be-bc
      url: https://github.com/zuspec/zuspec-be-bc.git
    - name: zuspec-rt-core
      url: https://github.com/zuspec/zuspec-rt-core.git
    - name: zuspec-rt-eng
      url: https://github.com/zuspec/zuspec-rt-eng.git
    - name: zuspec-be-sw
      url: https://github.com/zuspec/zuspec-be-sw.git
    - name: fw-proto-wb
      url: https://github.com/featherweight-ip/fw-proto-wb.git

    - name: fw-proto-gpio
      url: https://github.com/featherweight-ip/fw-proto-gpio.git
    - name: fwvip-gpio
      url: https://github.com/featherweight-vip/fwvip-gpio.git

    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
    - name: dv-flow-libformal
      url: https://github.com/dv-flow/dv-flow-libformal.git
    - name: dv-flow-libpss
      url: https://github.com/dv-flow/dv-flow-libpss.git
    - name: fwvip-wb
      url: https://github.com/featherweight-vip/fwvip-wb.git
    - name: verilator
      src: gh-rls
      url: https://github.com/edapack/verilator-bin
      cache: true
    - name: yosys
      src: gh-rls
      url: https://github.com/edapack/yosys-bin
      cache: true
    # Documentation build (Sphinx) — used by the docs CI workflow. 'sphinx'
    # itself is pulled in transitively via dv-flow-mgr; these are the extras the
    # fw-proto-wb docs need.
    - name: myst-parser
      src: pypi
    - name: furo
      src: pypi
    - name: sphinx-copybutton
      src: pypi
#      src: ivpm.yaml
#      url: https://github.com/edapack
#      dep-sets:
#      - verilator
