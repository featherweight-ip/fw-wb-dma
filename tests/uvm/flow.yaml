# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
fragment:
  name: uvm
  # UVM + fw-hdl environment for the SPL class model. The UVM register agent
  # drives the engine through the protocol-independent std_mem_if BFM; scenarios
  # mirror packages/wb_dma/bench (sw_dma / arb_test / hw_dma, Phase-1 subset).
  #
  # Requires UVM_HOME=$IVPM_PACKAGES/uvm (the uvm package ships no envrc;
  # hdlsim.vlt.SimLibUVM locates UVM via $UVM_HOME).
  tasks:

 
  # ---- Shared UVM env library + per-view images (base-* primitives) ------------
  # One base-uvm-env builds the env+tests SimLib ONCE. The env is a single package
  # (wb_dma_env_pkg), so the blanket *_pkg.sv glob sequences it fine; env-src only
  # needs to inject the upstream deps the package imports: `spl` (wb_dma_spl_pkg +
  # fw_hdl/fw_proto_* via its own needs), the wb + gpio UVM VIP sources, and
  # wb_ram_slv (the interface rtl_model binds via `virtual wb_ram_slv`). These are
  # added to env-src (not env) so their files precede the package that imports them.
  - { name: uvm-rtl-ram-src, uses: sv-module, with: {base: tb, include: [ wb_ram_slv.sv ] } }

  - name: uvm-env
    uses: dv.uvm.env-base
    # Feed the design-package deps AND the leaf's compile-flag DataItem through the
    # compound INPUT (not a subtask override): compound needs -> input -> pre-deps
    # -> env-src -> ... -> env-lib, so the dep files (and incdirs) precede the env
    # pkgs that import them, and flags-sim-comp reaches the SimLib compile. The
    # dv.uvm package is flag-agnostic; the leaf injects flags-sim-comp here.
    needs: [spl, org.fwvip.wb.vip-uvm-hvlsrc, org.fwvip.gpio.vip-uvm-hvlsrc, uvm-rtl-ram-src, flags-sim-comp]
    # env is a single package (wb_dma_env_pkg); env-base's default *_pkg.sv
    # glob picks it up -- no explicit env_include ordering needed.

  # SPL (TLM) image: shared env-lib + hvl_top_spl. No extra DUT sources -- the
  # class model lives in the env-lib (wb_dma_spl_pkg, pulled in via `spl`).
  - name: uvm-img
    uses: dv.uvm.tb-img
    # env-lib flows in from uvm-env; the leaf injects the image compile/elab flags.
    needs: [uvm-env, flags-sim-comp, flags-sim-elab]
    with:
      tb_include: [hdl_top_spl.sv, hvl_top_spl.sv]
      top: [hvl_top_spl]

  # ---- Signal-level (Wishbone) UVM path: same env+tests, wb_dma_spl DUT --------
  # The WB model pkg brings in the wrapper + Wishbone kit (via spl-rtl) on top of
  # the shared env sources.
  - name: uvm-wb-img
    uses: dv.uvm.tb-img
    needs: [uvm-env, spl-rtl, flags-sim-comp, flags-sim-elab]
    with:
      tb_include: [hdl_top_spl_wb.sv, hvl_top_spl_wb.sv]
      top: [hvl_top_spl_wb]

  # (WB scenarios are covered by the partitioned `uvm-universal` matrix below --
  # WB runs the universal, non-handshake tests. See the suite at end of file.)

  # ---- Signal-level (Wishbone) UVM path: same env+tests, wb_dma_top RTL DUT -----
  # Reuses the host register path + GPIO->int_changed seam from the WB model, but
  # backs the DUT's master (data) ports with combinational 0-wait-state SV RAMs
  # (wb_ram_slv) via wb_dma_rtl_model -- the wb_dma engine is proven against a
  # same-cycle memory, not a variable-latency transactor. The per-channel HS bus is
  # stubbed in hvl_top_rtl (tied off), so only sw_copy / arb run here. SimLibUVM
  # MUST precede the GPIO VIP (uvm base types first).
  # RTL image: OpenCores wb_dma_top (rtl) + wb_dma_spl transactor modules (spl-rtl).
  # wb_ram_slv already rides in the shared env-lib. hvl_top_rtl stubs the per-chan
  # HS bus, so only sw_copy / arb run here.
  - name: uvm-rtl-img
    uses: dv.uvm.tb-img
    needs: [uvm-env, rtl, spl-rtl, flags-sim-comp, flags-sim-elab]
    with:
      tb_include: [hdl_top_rtl.sv, hvl_top_rtl.sv]
      top: [hvl_top_rtl]
      # .v -> Verilog-2001 (the RTL uses `int` as a port name, reserved in SV);
      # --no-assert: the RTL's parallel_case/full_case pragmas trip Verilator's
      # $stop on the all-zero t=0 state before the first clocked reset load.
      sim_args: ["+1364-2001ext+v", "--no-assert"]

  # (RTL scenarios are covered by the partitioned `uvm-universal` matrix below --
  # RTL runs the universal, non-handshake tests. See the suite at end of file.)

  # ---- throughput benchmark: same wb_dma_perf_test on all three DUT flavours ----
  # Wall-clock-bounded (runs >= PERF_SECS); +PERF disables the sim-time watchdog.
  # Reports xfers/s + Mword/s; the tops also print START/FINISH wall-clock.
  - root: uvm-perf
    uses: hdlsim.vlt.SimRun
    needs: [uvm-img]
    with:
      plusargs: [UVM_TESTNAME=wb_dma_perf_test, PERF, PERF_LABEL=TLM, PERF_SECS=5]

  - root: uvm-wb-perf
    uses: hdlsim.vlt.SimRun
    needs: [uvm-wb-img]
    with:
      plusargs: [UVM_TESTNAME=wb_dma_perf_test, PERF, PERF_LABEL=SPL_XTOR, PERF_SECS=5]

  - root: uvm-rtl-perf
    uses: hdlsim.vlt.SimRun
    needs: [uvm-rtl-img]
    with:
      plusargs: [UVM_TESTNAME=wb_dma_perf_test, PERF, PERF_LABEL=RTL, PERF_SECS=5]

  #============================================================================
  # Partitioned regression suite.
  #
  # Tests split by what each model VERSION can drive:
  #   * UNIVERSAL (non-handshake) -- sw_copy / arb / arb_eq / err -- run on ALL
  #     three model images (TLM class-model, WB signal-level, RTL).
  #   * HS-HANDSHAKE -- hw_hs / hol -- run on the TLM class-model ONLY; the WB and
  #     RTL tops stub the per-channel hardware-handshake bus (see hvl_top_spl_wb /
  #     hvl_top_rtl), so those tests "stay on the TLM top".
  #
  # `uvm-universal` is a 2D matrix over (image x case): the case list is written
  # ONCE and each cell wires to its own image via `needs: ["${{ this.image }}"]`
  # (matrix-driven needs). arb/err use channel-keyed compare (+CMP_BY_CHANNEL);
  # arb_eq adds +CMP_NO_ORDER (round-robin: count, not order); hw_hs/hol +NO_CMP.
  #============================================================================
  - name: uvm-universal
    strategy:
      matrix:
        image: "${{ images }}"        # alias list (default tlm,wb,rtl; -D images=... to subset)
        case:
        - { testname: wb_dma_sw_copy_test, plusargs: [] }
        - { testname: wb_dma_arb_test,     plusargs: [CMP_BY_CHANNEL] }
        - { testname: wb_dma_arb_eq_test,  plusargs: [CMP_BY_CHANNEL, CMP_NO_ORDER] }
        - { testname: wb_dma_err_test,     plusargs: [CMP_BY_CHANNEL] }
    body:
    - name: "${{ this.image }}-${{ this.case.testname }}"
      uses: hdlsim.vlt.SimUVMCase
      needs: [ "${{ image_of[this.image] }}" ]   # alias -> image task
      with:
        testname: "${{ this.case.testname }}"
        plusargs: "${{ this.case.plusargs }}"

  # HS-handshake tests are TLM-only -- included only when the TLM image is
  # selected (so `-D images=rtl` doesn't drag in a TLM build).
  - name: uvm-hs-only
    iff: "${{ images | contains('tlm') }}"
    strategy:
      matrix:
        case:
        - { testname: wb_dma_hw_hs_test, plusargs: [NO_CMP] }
        - { testname: wb_dma_hol_test,   plusargs: [NO_CMP] }
    body:
    - name: "tlm-${{ this.case.testname }}"
      uses: hdlsim.vlt.SimUVMCase
      needs: [uvm-img]
      with:
        testname: "${{ this.case.testname }}"
        plusargs: "${{ this.case.plusargs }}"

  - root: uvm-tests
    desc: Full regression gate -- universal tests on all models + HS tests on TLM
    uses: hdlsim.SimSuiteReport
    needs: [uvm-universal, uvm-hs-only]
